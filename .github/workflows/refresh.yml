name: Refresh market data

on:
  schedule:
    # IDX session 09:00-16:00 WIB = 02:00-09:00 UTC. Every 30 min on weekdays, through the post-close summary.
    - cron: "5,35 1-11 * * 1-5"
    # news only, evenings and weekends
    - cron: "15 13,23 * * *"
    - cron: "15 5 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "curl_cffi>=0.10"
      - name: Fetch + build
        run: |
          if [ "${{ github.event.schedule }}" = "15 13,23 * * *" ] || [ "${{ github.event.schedule }}" = "15 5 * * 0,6" ]; then
            python scripts/refresh.py news
          else
            python scripts/refresh.py idx yahoo news build
          fi
      - name: Commit
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M')Z"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
